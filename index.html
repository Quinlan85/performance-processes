<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Performance Processes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  .slide {
    width: 100%;
    height: 100vh;
    background: radial-gradient(ellipse at center, #1a0000 0%, #000 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    font-family: 'Impact', 'Arial Black', sans-serif;
    cursor: pointer;
    user-select: none;
  }
  .title {
    font-size: clamp(16px, 2.8vw, 28px);
    letter-spacing: 0.12em;
    text-align: center;
    margin-bottom: 2rem;
  }
  .title span.red { color: #E8001C; }
  .title span.white { color: #fff; }
  .items-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    width: 100%;
    max-width: 900px;
  }
  .item {
    font-size: clamp(22px, 4.5vw, 48px);
    font-weight: 900;
    letter-spacing: 0.04em;
    text-align: center;
    opacity: 0;
    transform: translateY(18px) scale(0.96);
    transition: opacity 0.4s ease, transform 0.4s ease;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .item.red { color: #E8001C; }
  .item.white { color: #fff; }
  .item.visible {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  .item.dim {
    opacity: 0.15;
    transform: scale(0.97);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .counter {
    position: fixed;
    bottom: 1.2rem;
    right: 1.5rem;
    font-family: Arial, sans-serif;
    font-size: 13px;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.05em;
  }
  .hint {
    position: fixed;
    bottom: 1.2rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: Arial, sans-serif;
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .progress {
    position: fixed;
    bottom: 0;
    left: 0;
    height: 3px;
    background: #E8001C;
    transition: width 0.4s ease;
  }
</style>
</head>
<body>
<div class="slide" id="slide">
  <div class="title">
    <span class="white">PERFORMANCE </span><span class="red">PROCESSES</span>
  </div>
  <div class="items-container" id="items"></div>
</div>
<div class="counter" id="counter"></div>
<div class="hint" id="hint">click or press space to reveal</div>
<div class="progress" id="progress" style="width:0%"></div>

<script>
const items = [
  { text: "Controlled Aggression", color: "red" },
  { text: "Communicate Clearly", color: "white" },
  { text: "Touch Tight Marking", color: "red" },
  { text: "Intense Work-Rate", color: "white" },
  { text: "Brave on the Ball", color: "red" },
  { text: "Strong Body Language", color: "white" },
  { text: "Non-Stop Movement", color: "red" },
  { text: "Confident Self-Talk", color: "white" },
  { text: "Reset / Flush Mistakes", color: "red" },
  { text: "Always on My Toes", color: "white" },
  { text: "Ultra Focused", color: "red" },
  { text: "Hard Tackling", color: "white" }
];

let current = -1;
const container = document.getElementById('items');
const counter = document.getElementById('counter');
const hint = document.getElementById('hint');
const progress = document.getElementById('progress');

items.forEach((item, i) => {
  const el = document.createElement('div');
  el.className = `item ${item.color}`;
  el.id = `item-${i}`;
  el.textContent = item.text;
  container.appendChild(el);
});

function reveal() {
  if (current >= items.length - 1) {
    current = -1;
    document.querySelectorAll('.item').forEach(el => {
      el.classList.remove('visible', 'dim');
    });
    counter.textContent = '';
    hint.textContent = 'click or press space to start again';
    progress.style.width = '0%';
    return;
  }
  current++;
  document.querySelectorAll('.item').forEach((el, i) => {
    el.classList.remove('visible', 'dim');
    if (i < current) el.classList.add('dim');
    else if (i === current) el.classList.add('visible');
  });
  counter.textContent = `${current + 1} / ${items.length}`;
  hint.textContent = current < items.length - 1 ? 'click or press space for next' : 'click to reset';
  progress.style.width = `${((current + 1) / items.length) * 100}%`;
}

document.getElementById('slide').addEventListener('click', reveal);
document.addEventListener('keydown', (e) => {
  if (['Space', 'ArrowRight', 'ArrowDown', 'Enter'].includes(e.code)) {
    e.preventDefault();
    reveal();
  }
  if (['ArrowLeft', 'ArrowUp'].includes(e.code)) {
    e.preventDefault();
    if (current > 0) { current -= 2; reveal(); }
  }
});
</script>
</body>
</html>
